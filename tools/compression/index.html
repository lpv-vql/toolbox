<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト圧縮・展開</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor {
            height: 200px;
        }
        .field-container {
            margin-bottom: 35px;
        }
        .info-tag {
            display: inline-block;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>テキスト圧縮・展開</h1>            
    <div class="field-container">
        <h2>半角テキスト</h2>
        <div class="info-tag" id="text-count">文字数: 0</div>
        <textarea class="code-editor" id="text-input" spellcheck="false" placeholder="半角英数字・記号を入力してください" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮済み文字列</h2>
        <div class="info-tag" id="compressed-count">文字数: 0</div>
        <textarea class="code-editor" id="compressed-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-compressed-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    const textInput = document.getElementById('text-input');
    const compressedInput = document.getElementById('compressed-input');
    const errorStatus = document.getElementById('error-status');
    const textCount = document.getElementById('text-count');
    const compressedCount = document.getElementById('compressed-count');
            
    const copyTextBtn = document.getElementById('copy-text-btn');
    const copyCompressedBtn = document.getElementById('copy-compressed-btn');

    // 圧縮に使用する安全な「目に見える文字」の開始地点
    // U+3000(ひらがな・カタカナ周辺)からU+FFFFの手前までの広大な空間を利用
    const BIAS = 0x3000;
    // 基本多言語面の中で安全に表現できる文字数の上限（約5万文字のバッファ）
    const MAX_RANGE = 50000;

    // 圧縮ロジック（3文字またはそれ以下を1文字のUnicodeに安全にパッキング）
    function megaCompress(str) {
        if (!str) return '';
        
        let result = '';
        const chars = [...str];
        
        for (let i = 0; i < chars.length; i += 3) {
            // 残りの文字数を確認
            let remain = chars.length - i;
            let codePoint = BIAS;
            
            if (remain >= 3) {
                // 3文字ある場合：アスキーの組み合わせ
                let c1 = chars[i].charCodeAt(0) & 0x7F;
                let c2 = chars[i+1].charCodeAt(0) & 0x7F;
                let c3 = chars[i+2].charCodeAt(0) & 0x7F;
                
                // 3文字のデータを計算（128進数）
                let val = (c1 * 128 * 128) + (c2 * 128) + c3;
                
                // 割り算の余りを使って、MAX_RANGE(50000)を超えないように2文字に分けて出力
                // 通常は1文字、あふれた分はもう1文字添える（ほとんどは1文字で収まり平均1/3を維持）
                codePoint += (val % MAX_RANGE);
                result += String.fromCodePoint(codePoint);
                
                let extra = Math.floor(val / MAX_RANGE);
                if (extra > 0) {
                    // 識別用に少し離れた特殊文字領域にマッピング
                    result += String.fromCodePoint(BIAS + MAX_RANGE + extra);
                }
            } else if (remain === 2) {
                // 残り2文字の場合
                let c1 = chars[i].charCodeAt(0) & 0x7F;
                let c2 = chars[i+1].charCodeAt(0) & 0x7F;
                let val = (c1 * 128) + c2;
                // 2文字であることを示すために特別なオフセットを加算
                result += String.fromCodePoint(BIAS + MAX_RANGE + 100 + val);
            } else {
                // 残り1文字の場合
                let c1 = chars[i].charCodeAt(0) & 0x7F;
                result += String.fromCodePoint(BIAS + MAX_RANGE + 17000 + c1);
            }
        }
        return result;
    }

    // 展開ロジック
    function megaDecompress(str) {
        if (!str) return '';
        let result = '';
        const chars = [...str];
        
        for (let i = 0; i < chars.length; i++) {
            const cp = chars[i].codePointAt(0);
            let offset = cp - BIAS;
            
            if (offset < 0) throw new Error("不正な文字");
            
            if (offset < MAX_RANGE) {
                // 3文字圧縮のメイン文字
                let val = offset;
                
                // 次の文字が「あふれ分データ」かどうかチェック
                if (i + 1 < chars.length) {
                    let nextCp = chars[i+1].codePointAt(0) - BIAS;
                    if (nextCp > MAX_RANGE && nextCp <= MAX_RANGE + 50) {
                        val += (nextCp - MAX_RANGE) * MAX_RANGE;
                        i++; // あふれ分を消費
                    }
                }
                
                // 128進数から3文字を復元
                const c3 = val % 128;
                val = Math.floor(val / 128);
                const c2 = val % 128;
                const c1 = Math.floor(val / 128);
                
                result += String.fromCharCode(c1, c2, c3);
            } else if (offset >= MAX_RANGE + 100 && offset < MAX_RANGE + 17000) {
                // 2文字圧縮の復元
                let val = offset - (MAX_RANGE + 100);
                const c2 = val % 128;
                const c1 = Math.floor(val / 128);
                result += String.fromCharCode(c1, c2);
            } else if (offset >= MAX_RANGE + 17000) {
                // 1文字圧縮の復元
                let c1 = offset - (MAX_RANGE + 17000);
                result += String.fromCharCode(c1);
            }
        }
        return result;
    }

    // --- カウンター更新 ---
    function updateCounts() {
        textCount.innerText = `文字数: ${[...textInput.value].length}`;
        compressedCount.innerText = `文字数: ${[...compressedInput.value].length}`;
    }

    // 相互のイベント発火衝突を防ぐためのフラグ
    let isUpdating = false;

    // --- リアルタイムイベント処理 ---
    textInput.addEventListener('input', () => {
        if (isUpdating) return;
        isUpdating = true;

        const rawText = textInput.value;

        const hasFullWidth = [...rawText].some(char => char.charCodeAt(0) > 0x7F);
        if (hasFullWidth) {
            errorStatus.innerText = '注意: 全角文字が含まれています。正しく圧縮できない可能性があります。';
        } else {
            errorStatus.innerText = '';
        }

        if (!rawText) {
            compressedInput.value = '';
        } else {
            compressedInput.value = megaCompress(rawText);
        }
        
        updateCounts();
        isUpdating = false;
    });

    compressedInput.addEventListener('input', () => {
        if (isUpdating) return;
        isUpdating = true;

        const compressedText = compressedInput.value;
        if (!compressedText) {
            textInput.value = '';
            errorStatus.innerText = '';
        } else {
            try {
                textInput.value = megaDecompress(compressedText);
                errorStatus.innerText = '';
            } catch (e) {
                errorStatus.innerText = '変換エラー: 正しい圧縮データではありません。';
            }
        }
        
        updateCounts();
        isUpdating = false;
    });

    // --- コピー＆トースト処理 ---
    copyTextBtn.addEventListener('click', () => {
        textInput.select();
        copyToClipboard(textInput.value);
    });

    copyCompressedBtn.addEventListener('click', () => {
        compressedInput.select();
        copyToClipboard(compressedInput.value);
    });

    function copyToClipboard(text) {
        if (!text) return;
        navigator.clipboard.writeText(text)
            .then(() => { showToast("コピーしました！"); })
            .catch(() => { showToast("コピーに失敗しました。"); });
    }

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 1800);
    }
</script>
</body>
</html>
