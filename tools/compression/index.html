<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト圧縮・展開</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor { height: 150px; }
        .field-container { margin-bottom: 35px; }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>テキスト圧縮・展開</h1>
    
    <div class="field-container">
        <h2>テキスト</h2>
        <textarea class="code-editor" id="text-input" spellcheck="false" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮済み文字列</h2>
        <textarea class="code-editor" id="encoded-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-encoded-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
const textInput = document.getElementById('text-input');
const encodedInput = document.getElementById('encoded-input');
const errorStatus = document.getElementById('error-status');
const copyTextBtn = document.getElementById('copy-text-btn');
const copyEncodedBtn = document.getElementById('copy-encoded-btn');

// --- Base91風の圧縮・復元ロジック ---
// 指定された 95 文字のASCII文字セット
const CH_SET = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";

// 1. 圧縮 (Unicode文字列 -> 指定ASCII文字列)
function compressText(str) {
    if (!str) return "";
    // UTF-8のバイト配列に変換
    const bytes = new TextEncoder().encode(str);
    let ret = "";
    let n = 0;
    let b = 0;
    
    for (let i = 0; i < bytes.length; i++) {
        n |= bytes[i] << b;
        b += 8;
        if (b > 13) {
            let v = n & 8191;
            if (v > 88) {
                n >>= 13;
                b -= 13;
            } else {
                v = n & 16383;
                n >>= 14;
                b -= 14;
            }
            ret += CH_SET[v % 91] + CH_SET[Math.floor(v / 91)];
        }
    }
    if (b > 0) {
        ret += CH_SET[n % 91];
        if (b > 7 || n >= 91) {
            ret += CH_SET[Math.floor(n / 91)];
        }
    }
    return ret;
}

// 2. 伸長 (指定ASCII文字列 -> Unicode文字列)
function decompressText(str) {
    if (!str) return "";
    let bytes = [];
    let n = 0;
    let b = 0;
    let v = -1;

    for (let i = 0; i < str.length; i++) {
        const c = CH_SET.indexOf(str[i]);
        if (c === -1) throw new Error("無効な文字が含まれています");
        
        if (v < 0) {
            v = c;
        } else {
            v += c * 91;
            n |= v << b;
            b += (v & 8191) > 88 ? 13 : 14;
            do {
                bytes.push(n & 255);
                n >>= 8;
                b -= 8;
            } while (b > 7);
            v = -1;
        }
    }
    if (v >= 0) {
        bytes.push((n | (v << b)) & 255);
    }
    
    // バイト配列を文字列に戻す
    return new TextDecoder().decode(new Uint8Array(bytes));
}

// --- リアルタイム変換処理 ---

// 生テキスト入力時（圧縮を実行）
textInput.addEventListener('input', () => {
    const rawText = textInput.value;
    if (!rawText) {
        encodedInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        encodedInput.value = compressText(rawText);
        errorStatus.innerText = '';
    } catch (e) {
        errorStatus.innerText = '圧縮エラーが発生しました';
    }
});

// 圧縮テキスト入力時（復元を実行）
encodedInput.addEventListener('input', () => {
    const encodedText = encodedInput.value;
    if (!encodedText) {
        textInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        textInput.value = decompressText(encodedText);
        errorStatus.innerText = '';
    } catch (e) {
        errorStatus.innerText = '変換エラー: 正しい圧縮形式ではないか、指定外の文字が含まれています。';
    }
});

// --- コピーボタンの処理 ---
copyTextBtn.addEventListener('click', () => {
    textInput.select();
    copyToClipboard(textInput.value);
});

copyEncodedBtn.addEventListener('click', () => {
    encodedInput.select();
    copyToClipboard(encodedInput.value);
});

// クリップボードコピー＆トースト表示共通関数
function copyToClipboard(text) {
    if (!text) return; 
    navigator.clipboard.writeText(text)
        .then(() => { showToast("コピーしました！"); })
        .catch(() => { showToast("コピーに失敗しました。手動でコピーしてください。"); });
}

let toastTimeout;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 1800);
}
</script>
</body>
</html>
