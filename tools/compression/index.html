<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト圧縮・解凍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor { height: 150px; }
        .field-container { margin-bottom: 35px; }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>テキスト圧縮・解凍</h1>
    
    <div class="field-container">
        <h2>テキスト</h2>
        <p>指定の英数字・記号のみのテキストを入力してください</p>
        <textarea class="code-editor" id="text-input" spellcheck="false" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮された文字列 (Unicode)</h2>
        <textarea class="code-editor" id="encoded-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-encoded-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
const textInput = document.getElementById('text-input');
const encodedInput = document.getElementById('encoded-input');
const errorStatus = document.getElementById('error-status');
const copyTextBtn = document.getElementById('copy-text-btn');
const copyEncodedBtn = document.getElementById('copy-encoded-btn');

// 指定された 95 文字の辞書
const CH_SET = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
const BASE = 95;

// 使用するUnicodeの開始位置（CJK統合漢字エリア：1文字で3文字分の情報を保持可能）
const OFFSET = 0x4E00; 

// 1. 圧縮 (ASCII 3文字 -> Unicode 1文字)
function compressASCII(str) {
    if (!str) return "";
    
    let result = "";
    // 元の文字列の長さを3で割った余り（0, 1, 2）
    const mod = str.length % 3;

    for (let i = 0; i < str.length; i += 3) {
        let chunk = str.substring(i, i + 3);
        
        // パディング（3文字に満たない場合はスペースで埋める）
        while (chunk.length < 3) {
            chunk += " ";
        }

        const v0 = CH_SET.indexOf(chunk.charAt(0));
        const v1 = CH_SET.indexOf(chunk.charAt(1));
        const v2 = CH_SET.indexOf(chunk.charAt(2));

        if (v0 === -1 || v1 === -1 || v2 === -1) {
            throw new Error("指定外の文字が含まれています");
        }

        // 95進数の計算 (最大: 95^3 - 1 = 857,374)
        let num = v0 + v1 * BASE + v2 * BASE * BASE;
        
        // 最初の1文字目にのみ、余りの情報（0, 1, 2）を混ぜ込む
        // 857,374 * 3 + 2 = 2,572,124 (Unicodeの最大値 1,114,111 を超えないよう、ここでは安全に足し算で保持)
        // 1文字の最大値が 857,375 通りなので、modを区別するために num を 3倍するのではなく、
        // 3つの状態ごとに基本となる値（OFFSET）をずらすアプローチに変更します。
        let finalOffset = OFFSET;
        if (i === 0) {
            // 最初のブロックだけ、mod(0,1,2) に応じて100,000ずつズラして配置
            finalOffset += (mod * 100000);
        }

        result += String.fromCodePoint(finalOffset + num);
    }
    return result;
}

// 2. 復元 (Unicode 1文字 -> ASCII 3文字)
function decompressASCII(str) {
    if (!str) return "";
    
    let result = "";
    let mod = 0;

    // 最初の文字のCodePointからmod（余り）を逆算する
    if (str.length > 0) {
        const firstCode = str.codePointAt(0);
        if (firstCode >= OFFSET + 200000) {
            mod = 2;
        } else if (firstCode >= OFFSET + 100000) {
            mod = 1;
        } else {
            mod = 0;
        }
    }

    // String.prototype.length ではなく、正しくUnicodeの文字数でループを回す
    const chars = Array.from(str);

    for (let i = 0; i < chars.length; i++) {
        const codePoint = chars[i].codePointAt(0);
        let num = codePoint - OFFSET;
        
        // 最初の文字はmodのズレを直す
        if (i === 0) {
            num -= (mod * 100000);
        }
        
        if (num < 0) throw new Error("無効な文字データです");

        // 95進数を分解して元の3文字に戻す
        const v0 = num % BASE;
        num = Math.floor(num / BASE);
        const v1 = num % BASE;
        const v2 = Math.floor(num / BASE);

        if (v0 >= BASE || v1 >= BASE || v2 >= BASE || v0 < 0 || v1 < 0 || v2 < 0) {
            throw new Error("復元エラー");
        }

        let chunk = CH_SET.charAt(v0) + CH_SET.charAt(v1) + CH_SET.charAt(v2);
        
        // 最後のブロックかつ、元のデータに端数（余り）があった場合の処理
        if (i === chars.length - 1 && mod > 0) {
            chunk = chunk.substring(0, mod);
        }
        
        result += chunk;
    }
    return result;
}

// --- リアルタイム変換処理 ---

textInput.addEventListener('input', () => {
    const rawText = textInput.value;
    if (!rawText) {
        encodedInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        // 確実な方法（charAt）で指定外の文字が含まれていないかチェック
        for (let i = 0; i < rawText.length; i++) {
            if (CH_SET.indexOf(rawText.charAt(i)) === -1) {
                throw new Error();
            }
        }
        encodedInput.value = compressASCII(rawText);
        errorStatus.innerText = '';
    } catch (e) {
        errorStatus.innerText = '変換エラー: 指定された95文字以外の文字（日本語など）が含まれています。';
    }
});

encodedInput.addEventListener('input', () => {
    const encodedText = encodedInput.value;
    if (!encodedText) {
        textInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        textInput.value = decompressASCII(encodedText);
        errorStatus.innerText = '';
    } catch (e) {
        textInput.value = '';
        errorStatus.innerText = '変換エラー: 正しい圧縮形式ではありません。';
    }
});

// --- コピーボタンの処理 ---
copyTextBtn.addEventListener('click', () => {
    textInput.select();
    copyToClipboard(textInput.value);
});

copyEncodedBtn.addEventListener('click', () => {
    encodedInput.select();
    copyToClipboard(encodedInput.value);
});

function copyToClipboard(text) {
    if (!text) return; 
    navigator.clipboard.writeText(text)
        .then(() => { showToast("コピーしました！"); })
        .catch(() => { showToast("コピーに失敗しました。手動でコピーしてください。"); });
}

let toastTimeout;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 1800);
}
</script>
</body>
</html>
