<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト圧縮・展開</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor {
            height: 200px;
        }
        .field-container {
            margin-bottom: 35px;
        }
        .info-tag {
            display: inline-block;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>テキスト圧縮・展開</h1>            
    <div class="field-container">
        <h2>半角テキスト</h2>
        <div class="info-tag" id="text-count">文字数: 0</div>
        <textarea class="code-editor" id="text-input" spellcheck="false" placeholder="半角英数字・記号を入力してください" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮済み文字列</h2>
        <div class="info-tag" id="compressed-count">文字数: 0</div>
        <textarea class="code-editor" id="compressed-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-compressed-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    const textInput = document.getElementById('text-input');
    const compressedInput = document.getElementById('compressed-input');
    const errorStatus = document.getElementById('error-status');
    const textCount = document.getElementById('text-count');
    const compressedCount = document.getElementById('compressed-count');
            
    const copyTextBtn = document.getElementById('copy-text-btn');
    const copyCompressedBtn = document.getElementById('copy-compressed-btn');

    // CJK統合漢字の安全な開始地点 (U+4E00) をベースに使用
    // 14ビット(16384通り)移動しても通常の漢字領域に収まるため絶対にブラウザで壊れません
    const BIAS = 0x4E00; 

    // 圧縮ロジック (半角2文字の7bitアスキーを1つの14bitコードポイントに結合)
    function safeCompress(str) {
        if (!str) return '';
        let result = '';
        
        for (let i = 0; i < str.length; i += 2) {
            let c1 = str.charCodeAt(i) & 0x7F;
            // 奇数文字目で終わる場合は、2文字目をダミー(0x7F)にする
            let c2 = (i + 1 < str.length) ? (str.charCodeAt(i + 1) & 0x7F) : 0x7F;
            
            // 7bit × 2 = 14bit の数値を生成して漢字に変形
            const codePoint = BIAS + (c1 << 7) + c2;
            result += String.fromCharCode(codePoint);
        }
        return result;
    }

    // 展開ロジック
    function safeDecompress(str) {
        if (!str) return '';
        let result = '';
        
        for (let i = 0; i < str.length; i++) {
            const codePoint = str.charCodeAt(i);
            const offset = codePoint - BIAS;
            
            // 漢字領域外の文字が含まれている場合のチェック
            if (offset < 0 || offset > 0x3FFF) {
                throw new Error("対応していない文字が含まれています");
            }
            
            // 14bitから7bitずつ2文字を切り出す
            const c1 = (offset >> 7) & 0x7F;
            const c2 = offset & 0x7F;
            
            if (c1 !== 0x7F) result += String.fromCharCode(c1);
            if (c2 !== 0x7F) result += String.fromCharCode(c2);
        }
        return result;
    }

    // --- カウンター更新 ---
    function updateCounts() {
        textCount.innerText = `文字数: ${textInput.value.length}`;
        compressedCount.innerText = `文字数: ${compressedInput.value.length}`;
    }

    // 入力イベントが無限ループで衝突するのを完全に防ぐフラグ
    let lock = false;

    // --- リアルタイムイベント処理 ---
    textInput.addEventListener('input', () => {
        if (lock) return;
        lock = true;

        const rawText = textInput.value;
        
        // 簡易的な全角チェック
        if (/[^\x00-\x7F]/.test(rawText)) {
            errorStatus.innerText = '注意: 全角文字が含まれています。正しく圧縮できません。';
        } else {
            errorStatus.innerText = '';
        }

        compressedInput.value = safeCompress(rawText);
        
        updateCounts();
        lock = false;
    });

    compressedInput.addEventListener('input', () => {
        if (lock) return;
        lock = true;

        const compressedText = compressedInput.value;
        if (!compressedText) {
            textInput.value = '';
            errorStatus.innerText = '';
        } else {
            try {
                textInput.value = safeDecompress(compressedText);
                errorStatus.innerText = '';
            } catch (e) {
                errorStatus.innerText = '変換エラー: 正しい圧縮データではありません。';
                textInput.value = '';
            }
        }
        
        updateCounts();
        lock = false;
    });

    // --- コピー＆トースト処理 ---
    copyTextBtn.addEventListener('click', () => {
        textInput.select();
        copyToClipboard(textInput.value);
    });

    copyCompressedBtn.addEventListener('click', () => {
        compressedInput.select();
        copyToClipboard(compressedInput.value);
    });

    function copyToClipboard(text) {
        if (!text) return;
        navigator.clipboard.writeText(text)
            .then(() => { showToast("コピーしました！"); })
            .catch(() => { showToast("コピーに失敗しました。"); });
    }

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 1800);
    }
</script>
</body>
</html>
