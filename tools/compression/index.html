<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII文字 1/3圧縮ツール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor { height: 150px; }
        .field-container { margin-bottom: 35px; }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>ASCII文字 1/3圧縮ツール</h1>
    
    <div class="field-container">
        <h2>テキスト (元のASCIIデータ)</h2>
        <p>指定の英数字・記号のみのテキストを入力してください（文字数が1/3に圧縮されます）</p>
        <textarea class="code-editor" id="text-input" spellcheck="false" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮された文字列 (Unicode)</h2>
        <p>めいっぱいUnicode文字を使って短縮されたデータが出力されます（デコードも可能）</p>
        <textarea class="code-editor" id="encoded-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-encoded-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
const textInput = document.getElementById('text-input');
const encodedInput = document.getElementById('encoded-input');
const errorStatus = document.getElementById('error-status');
const copyTextBtn = document.getElementById('copy-text-btn');
const copyEncodedBtn = document.getElementById('copy-encoded-btn');

// 指定された 95 文字の辞書
const CH_SET = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
const BASE = 95;

// 使用するUnicodeの開始位置（CJK統合漢字の「一」から始まる領域。1文字で綺麗に表現可能）
const OFFSET = 0x4E00; 

// 1. 圧縮 (ASCII 3文字 -> Unicode 1文字)
function compressASCII(str) {
    if (!str) return "";
    
    let result = "";
    
    // 文字列の先頭に、元の文字数を3で割った余り（0, 1, 2）を識別するための情報を1文字として埋め込むのは非効率なので、
    // 最初の1文字目に余りの情報（0〜2）をエンコード時に混ぜ込みます。
    const mod = str.length % 3;

    for (let i = 0; i < str.length; i += 3) {
        let chunk = str.substring(i, i + 3);
        
        // パディング（3文字に満たない場合はスペースで埋める）
        while (chunk.length < 3) {
            chunk += " ";
        }

        const v0 = CH_SET.indexOf(chunk[0]);
        const v1 = CH_SET.indexOf(chunk[1]);
        const v2 = CH_SET.indexOf(chunk[2]);

        if (v0 === -1 || v1 === -1 || v2 === -1) {
            throw new Error("指定外の文字が含まれています");
        }

        // 95進数の計算 (最大: 95^3 - 1 = 857,374)
        let num = v0 + v1 * BASE + v2 * BASE * BASE;
        
        // 最初のブロックの計算にのみ、余りの情報（0, 1, 2）を組み込む
        // 857,375 * 3 = 2,572,125 になり、これも1文字（Unicodeの範囲内）に安全に収まります
        if (i === 0) {
            num = num * 3 + mod;
        }

        result += String.fromCodePoint(OFFSET + num);
    }
    return result;
}

// 2. 復元 (Unicode 1文字 -> ASCII 3文字)
function decompressASCII(str) {
    if (!str) return "";
    
    let result = "";
    let mod = 0;

    for (let i = 0; i < str.length; i++) {
        const codePoint = str.codePointAt(i);
        let num = codePoint - OFFSET;
        
        if (num < 0) throw new Error("無効な文字データです");

        // 最初のブロックから余りの情報（元の長さを3で割った余り）を取り出す
        if (i === 0) {
            mod = num % 3;
            num = Math.floor(num / 3);
        }

        // 95進数を分解して元の3文字に戻す
        const v0 = num % BASE;
        num = Math.floor(num / BASE);
        const v1 = num % BASE;
        const v2 = Math.floor(num / BASE);

        if (v0 >= BASE || v1 >= BASE || v2 >= BASE) {
            throw new Error("復元エラー");
        }

        let chunk = CH_SET[v0] + CH_SET[v1] + CH_SET[v2];
        
        // ループの最後（最後の3文字ブロック）かつ、元のデータに端数があった場合の処理
        if (i === str.length - 1 && mod > 0) {
            chunk = chunk.substring(0, mod);
        }
        
        result += chunk;
    }
    return result;
}

// --- リアルタイム変換処理 ---

textInput.addEventListener('input', () => {
    const rawText = textInput.value;
    if (!rawText) {
        encodedInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        // 入力文字列に指定外の文字がないか事前チェック
        for (let char of rawText) {
            if (CH_SET.indexOf(char) === -1) {
                throw new Error();
            }
        }
        encodedInput.value = compressASCII(rawText);
        errorStatus.innerText = '';
    } catch (e) {
        errorStatus.innerText = '変換エラー: 指定された95文字以外の文字（日本語など）が含まれています。';
    }
});

encodedInput.addEventListener('input', () => {
    const encodedText = encodedInput.value;
    if (!encodedText) {
        textInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        textInput.value = decompressASCII(encodedText);
        errorStatus.innerText = '';
    } catch (e) {
        textInput.value = '';
        errorStatus.innerText = '変換エラー: 正しい圧縮形式ではありません。';
    }
});

// --- コピーボタンの処理 ---
copyTextBtn.addEventListener('click', () => {
    textInput.select();
    copyToClipboard(textInput.value);
});

copyEncodedBtn.addEventListener('click', () => {
    encodedInput.select();
    copyToClipboard(encodedInput.value);
});

function copyToClipboard(text) {
    if (!text) return; 
    navigator.clipboard.writeText(text)
        .then(() => { showToast("コピーしました！"); })
        .catch(() => { showToast("コピーに失敗しました。手動でコピーしてください。"); });
}

let toastTimeout;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 1800);
}
</script>
</body>
</html>
