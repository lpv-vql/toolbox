<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト圧縮・解凍</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor { height: 150px; }
        .field-container { margin-bottom: 35px; }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>テキスト圧縮・解凍</h1>
    
    <div class="field-container">
        <h2>テキスト</h2>
        <p>指定の英数字・記号のみのテキストを入力してください</p>
        <textarea class="code-editor" id="text-input" spellcheck="false" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>圧縮された文字列 (Unicode)</h2>
        <textarea class="code-editor" id="encoded-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-encoded-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
const textInput = document.getElementById('text-input');
const encodedInput = document.getElementById('encoded-input');
const errorStatus = document.getElementById('error-status');
const copyTextBtn = document.getElementById('copy-text-btn');
const copyEncodedBtn = document.getElementById('copy-encoded-btn');

// 指定された 95 文字の辞書
const CH_SET = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
const BASE = 95;

// 使用するUnicodeの開始位置（CJK統合漢字エリア）
const OFFSET = 0x4E00; 

// 端数（0, 1, 2文字の余り）を表現するための、絶対に衝突しない専用のUnicode文字（ハングル互換名辞エリアなどから安全な3文字をチョイス）
const PAD_MARKERS = [0x3131, 0x3132, 0x3133]; // [余りなし, 1文字余り, 2文字余り]

// 1. 圧縮 (ASCII 3文字 -> Unicode 1文字)
function compressASCII(str) {
    if (!str) return "";
    
    let result = "";
    const mod = str.length % 3;

    for (let i = 0; i < str.length; i += 3) {
        let chunk = str.substring(i, i + 3);
        
        // パディング（3文字に満たない場合はスペースで埋めるが、元の状態はmodで記録しているため文字化けしません）
        while (chunk.length < 3) {
            chunk += " ";
        }

        const v0 = CH_SET.indexOf(chunk.charAt(0));
        const v1 = CH_SET.indexOf(chunk.charAt(1));
        const v2 = CH_SET.indexOf(chunk.charAt(2));

        if (v0 === -1 || v1 === -1 || v2 === -1) {
            throw new Error("指定外の文字が含まれています");
        }

        // 95進数の純粋な計算 (最大: 95^3 - 1 = 857,374)
        const num = v0 + v1 * BASE + v2 * BASE * BASE;
        result += String.fromCodePoint(OFFSET + num);
    }

    // 圧縮文字列の「最後」に、端数の状態を表すマーカーを1文字だけ付与する
    result += String.fromCodePoint(PAD_MARKERS[mod]);
    return result;
}

// 2. 復元 (Unicode 1文字 -> ASCII 3文字)
function decompressASCII(str) {
    if (!str) return "";
    
    // サロゲートペアを考慮して安全に配列化
    const chars = Array.from(str);
    if (chars.length < 1) return "";

    // 最後の1文字（マーカー）を取り出して、元のデータの端数（mod）を判定する
    const markerChar = chars.pop();
    const markerCode = markerChar.codePointAt(0);
    const mod = PAD_MARKERS.indexOf(markerCode);

    if (mod === -1) {
        throw new Error("不正な圧縮マーカーです");
    }

    let result = "";

    for (let i = 0; i < chars.length; i++) {
        const codePoint = chars[i].codePointAt(0);
        let num = codePoint - OFFSET;
        
        if (num < 0) throw new Error("無効な文字データです");

        // 95進数を分解して元の3文字に戻す
        const v0 = num % BASE;
        num = Math.floor(num / BASE);
        const v1 = num % BASE;
        const v2 = Math.floor(num / BASE);

        if (v0 >= BASE || v1 >= BASE || v2 >= BASE || v0 < 0 || v1 < 0 || v2 < 0) {
            throw new Error("復元エラー");
        }

        let chunk = CH_SET.charAt(v0) + CH_SET.charAt(v1) + CH_SET.charAt(v2);
        
        // 最後の3文字ブロック、かつ、元のデータに端数（1文字または2文字の余り）があった場合のトリミング処理
        if (i === chars.length - 1 && mod > 0) {
            chunk = chunk.substring(0, mod);
        }
        
        result += chunk;
    }
    return result;
}

// --- リアルタイム変換処理 ---

textInput.addEventListener('input', () => {
    const rawText = textInput.value;
    if (!rawText) {
        encodedInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        for (let i = 0; i < rawText.length; i++) {
            if (CH_SET.indexOf(rawText.charAt(i)) === -1) {
                throw new Error();
            }
        }
        encodedInput.value = compressASCII(rawText);
        errorStatus.innerText = '';
    } catch (e) {
        errorStatus.innerText = '変換エラー: 指定された95文字以外の文字（日本語など）が含まれています。';
    }
});

encodedInput.addEventListener('input', () => {
    const encodedText = encodedInput.value;
    if (!encodedText) {
        textInput.value = '';
        errorStatus.innerText = '';
        return;
    }
    try {
        textInput.value = decompressASCII(encodedText);
        errorStatus.innerText = '';
    } catch (e) {
        textInput.value = '';
        errorStatus.innerText = '変換エラー: 正しい圧縮形式ではありません。';
    }
});

// --- コピーボタンの処理 ---
copyTextBtn.addEventListener('click', () => {
    textInput.select();
    copyToClipboard(textInput.value);
});

copyEncodedBtn.addEventListener('click', () => {
    encodedInput.select();
    copyToClipboard(encodedInput.value);
});

function copyToClipboard(text) {
    if (!text) return; 
    navigator.clipboard.writeText(text)
        .then(() => { showToast("コピーしました！"); })
        .catch(() => { showToast("コピーに失敗しました。手動でコピーしてください。"); });
}

let toastTimeout;
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 1800);
}
</script>
</body>
</html>
