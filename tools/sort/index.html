<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字ソートツール</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .control-group { background: #f9f9f9; padding: 10px 15px; border-radius: 6px; border: 1px solid #ddd; }
        .code-editor { height: 300px; width: 100%; box-sizing: border-box; padding: 10px; font-family: monospace; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; }
        .radio-label { display: inline-flex; align-items: center; margin-right: 15px; font-weight: normal; cursor: pointer; }
        .radio-label input { margin-right: 5px; }
        .output-area { margin-top: 20px; }
    </style>
</head>
<body>
<header>
  <a href="/toolbox" class="logo">Toolbox</a>
</header>
<main>
<div id="app" class="container">
    <h1>文字ソートツール</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>ソート対象</label>
            <label class="radio-label">
                <input type="radio" value="line" v-model="sortMode"> 一行ずつ
            </label>
            <label class="radio-label">
                <input type="radio" value="char" v-model="sortMode"> 一文字ずつ
            </label>
        </div>
        
        <div class="control-group">
            <label>並び順</label>
            <label class="radio-label">
                <input type="radio" value="asc" v-model="sortOrder"> 昇順
            </label>
            <label class="radio-label">
                <input type="radio" value="desc" v-model="sortOrder"> 降順
            </label>
        </div>
    </div>

    <h2>テキストを入力してください</h2>
    <textarea class="code-editor" v-model="inputText" placeholder="ここにテキストを入力するか、貼り付けてください..."></textarea>

    <div class="output-area">
        <h2>ソート結果</h2>
        <pre><code>{{ processedText }}</code></pre>
        <button class="copy-btn" @click="copyToClipboard">結果をコピー</button>
    </div>

    <div class="toast" :class="{ show: isToastShow }">{{ toastMessage }}</div>
</div>
</main>

<script>
    const { createApp, ref, computed } = Vue;
    createApp({
        setup() {
            const inputText = ref("");
            const sortMode = ref("line");   // 'line' (行単位) または 'char' (文字単位)
            const sortOrder = ref("asc");   // 'asc' (昇順) または 'desc' (降順)

            // トースト用のリアクティブデータ
            const isToastShow = ref(false);
            const toastMessage = ref("コピーしました！");
            let toastTimeout = null;

            // ソート処理の計算プロパティ
            const processedText = computed(() => {
                if (!inputText.value) return "";

                if (sortMode.value === "line") {
                    // --- 行単位でのソート ---
                    const lines = inputText.value.split('\n');
                    
                    lines.sort((a, b) => {
                        return sortOrder.value === "asc" ? a.localeCompare(b) : b.localeCompare(a);
                    });
                    
                    return lines.join('\n');
                } else {
                    // --- 一文字ずつでのソート（改行や空白を無視して1つにまとめる場合） ---
                    // 改行を取り除いて配列化（スペース等も詰めたい場合は .replace(/\s+/g, '') などに変えてください）
                    const chars = inputText.value.replace(/\n/g, '').split('');
                    
                    chars.sort((a, b) => {
                        return sortOrder.value === "asc" ? a.localeCompare(b) : b.localeCompare(a);
                    });
                    
                    return chars.join('');
                }
            });

            // クリップボードコピー & トーストアニメーション処理
            const copyToClipboard = () => {
                if (!processedText.value) {
                    toastMessage.value = "コピーするテキストがありません";
                    showToast();
                    return;
                }
                navigator.clipboard.writeText(processedText.value).then(() => {
                    toastMessage.value = "コピーしました！";
                    showToast();
                }).catch(err => {
                    console.error('コピーに失敗しました: ', err);
                });
            };

            // トーストの表示制御関数
            const showToast = () => {
                isToastShow.value = true;
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    isToastShow.value = false;
                }, 2000);
            };

            return { 
                inputText, 
                sortMode,
                sortOrder,
                processedText, 
                copyToClipboard,
                isToastShow,
                toastMessage
            };
        }
    }).mount('#app');
</script>
</body>
</html>
