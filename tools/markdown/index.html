<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdownプレビュー</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
      .code-editor { height: 200px; }
      .preview-area {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 15px;
        overflow-y: auto;
        background-color: #fff;
        color: #333;
      }
    .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
            border-bottom: none;
            padding-bottom: 0;
        }

        .md-body h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .md-body h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: 0.3em; }
        .md-body h3 { font-size: 1.25em; }
        .md-body h4 { font-size: 1em; }

        /* 文章・段落 */
        .md-body p {
            margin-top: 0;
            margin-bottom: 16px;
            color: #24292f;
        }

        /* リストスタイル（外部のreset CSS対策） */
        .md-body ul, .md-body ol {
            padding-left: 2em;
            margin-top: 0;
            margin-bottom: 16px;
            list-style-position: outside !important;
        }
        .md-body ul { list-style-type: disc !important; }
        .md-body ol { list-style-type: decimal !important; }
        .md-body li { margin-top: 0.25em; }

        /* リンク */
        .md-body a {
            color: #0969da !important;
            text-decoration: none;
        }
        .md-body a:hover {
            text-decoration: underline;
        }

        /* 引用（Blockquote） */
        .md-body blockquote {
            padding: 0 1em;
            color: #57606a;
            border-left: 0.25em solid #d0d7de;
            margin: 0 0 16px 0;
            background: none;
        }

        /* インラインコード（文字の中の `code`） */
        .md-body :not(pre) > code {
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            background-color: rgba(175, 184, 193, 0.2);
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
        }

        /* コードブロック（複数行のコード） */
        .md-body pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background-color: #f6f8fa;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .md-body pre code {
            background: transparent;
            padding: 0;
            margin: 0;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            color: #24292f;
        }

        /* 水平線 */
        .md-body hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: #sub-border, #d0d7de;
            border: 0;
        }

        /* テーブル */
        .md-body table {
            display: block;
            width: 100%;
            width: max-content;
            max-width: 100%;
            overflow: auto;
            margin-top: 0;
            margin-bottom: 16px;
            border-collapse: collapse;
        }
        .md-body table th { font-weight: 600; }
        .md-body table th, .md-body table td {
            padding: 6px 13px;
            border: 1px solid #d0d7de;
        }
        .md-body table tr {
            background-color: #fff;
            border-top: 1px solid #c6cbd1;
        }
        .md-body table tr:nth-child(2n) {
            background-color: #f6f8fa;
        }
    </style>
</head>
<body>

  <header>
    <a href="/toolbox" class="logo">Toolbox</a>
  </header>

  <main>
    <h1>Markdownプレビュー</h1>
    <h2>Markdownを入力してください</h2>
    <div>
      <textarea id="markdown-input" class="code-editor"></textarea>
    </div>
    <h2>プレビュー</h2>
    <div class="preview-area">
      <div id="preview" class="md-body"></div>
    </div>
  </main>

  <script>
        const markdownInput = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        // MarkdownをHTMLに変換してプレビューに反映する関数
        function updatePreview() {
            const markdownText = markdownInput.value;
            // marked.parse() でMarkdownをHTML文字列に変換
            preview.innerHTML = marked.parse(markdownText);
        }

        // 入力されるたびに（リアルタイムで）更新を実行
        markdownInput.addEventListener('input', updatePreview);

        // 初期実行（プレビューを空にしないため）
        updatePreview();
    </script>

</body>
</html>
