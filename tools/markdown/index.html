<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdownプレビュー</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
      .code-editor { height: 300px; }
      .preview-area {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 15px;
        overflow-y: auto;
        background-color: #fff;
        color: #333;
      }
    </style>
</head>
<body>

  <header>
    <a href="/toolbox" class="logo">Toolbox</a>
  </header>

  <main>
    <h1>Markdownプレビュー</h1>
    <h2>Markdownを入力してください</h2>
    <div>
      <textarea id="markdown-input" class="code-editor"></textarea>
    </div>
    <h2>プレビュー</h2>
    <div id="preview" class="preview-area"></div>
  </main>

  <script>
        const markdownInput = document.getElementById('markdown-input');
        const preview = document.getElementById('preview');

        // MarkdownをHTMLに変換してプレビューに反映する関数
        function updatePreview() {
            const markdownText = markdownInput.value;
            // marked.parse() でMarkdownをHTML文字列に変換
            preview.innerHTML = marked.parse(markdownText);
        }

        // 入力されるたびに（リアルタイムで）更新を実行
        markdownInput.addEventListener('input', updatePreview);

        // 初期実行（プレビューを空にしないため）
        updatePreview();
    </script>

</body>
</html>
