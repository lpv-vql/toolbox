<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>半角スペースを改行に変換</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
      .code-editor { height: 200px; }
    </style>
</head>
<body>
  <header>
    <a href="/toolbox" class="logo">Toolbox</a>
  </header>

  <main>
    <h1>半角スペースを改行に変換</h1>
    <h2>テキストを入力</h2>
    <textarea id="inputText" class="code-editor" oninput="convertSpaceToNewline()" placeholder=""></textarea>

    <h2>変換後の結果</h2>
    <textarea id="outputText" readonly placeholder=""></textarea>
    <button class="btn-copy" onclick="copyToClipboard()">結果をコピー</button>
  </main>

    <script>
        function convertSpaceToNewline() {
            const input = document.getElementById('inputText').value;
            // 入力された内容の半角スペースをすべて改行に置換
            const converted = input.replace(/ /g, '\n');
            document.getElementById('outputText').value = converted;
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('コピーするコンテンツがありません。');
                return;
            }
            outputText.select();
            document.execCommand('copy');
            alert('クリップボードにコピーしました！');
        }
    </script>

</body>
</html>
