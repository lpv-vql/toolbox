<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>半角スペースを改行に</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor { height: 200px; }
        .output-area { margin-top: 20px; }
    </style>
</head>
<body>
<header>
  <a href="/toolbox" class="logo">Toolbox</a>
</header>
<main id="app">
    <h1>半角スペースを改行に</h1>
    <h2>テキストを入力してください</h2>
    <textarea class="code-editor" v-model="inputText"></textarea>

    <div class="output-area">
        <h2>変換結果</h2>
        <pre><code>{{ processedCode }}</code></pre>
        <button class="copy-btn" @click="copyToClipboard">結果をコピー</button>
    </div>

    <div class="toast" :class="{ show: isToastShow }">{{ toastMessage }}</div>
</main>

<script>
    const { createApp, ref, computed } = Vue;
    createApp({
        setup() {
            const inputText = ref("");
            const squashSpaces = ref(false); // 連続スペースをまとめるかどうかのフラグ

            // トースト用のリアクティブデータ
            const isToastShow = ref(false);
            const toastMessage = ref("コピーしました！");
            let toastTimeout = null;

            // リアルタイムで変換処理を行う算出プロパティ
            const processedCode = computed(() => {
                if (!inputText.value) return "";
                const regex = squashSpaces.value ? / +/g : / /g;
                return inputText.value.replace(regex, '\n');
            });

            // クリップボードコピー & トーストアニメーション処理
            const copyToClipboard = () => {
                if (!processedCode.value) return;

                navigator.clipboard.writeText(processedCode.value).then(() => {
                    toastMessage.value = "コピーしました！";
                    showToast();
                }).catch(err => {
                    console.error('コピーに失敗しました: ', err);
                });
            };

            // トーストの表示制御関数
            const showToast = () => {
                isToastShow.value = true;

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    isToastShow.value = false;
                }, 2000);
            };

            return { 
                inputText, 
                squashSpaces, 
                processedCode, 
                copyToClipboard,
                isToastShow,
                toastMessage
            };
        }
    }).mount('#app');
</script>
</body>
</html>
