<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像Base64エンコーダー / デコーダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        input[type="file"] {
            margin-top: 10px;
            font-size: 16px;
        }
        .code-editor {
            height: 250px;
        }
        .preview-container {
            text-align: center;
            margin-top: 15px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
        }
        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border: 1px solid #ddd;
        }
        .section {
            margin-bottom: 40px;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
        }
        .status {
            color: #e74c3c;
            margin-top: 10px;
            font-weight: bold;
        }
        .success {
            color: #2ecc71;
            margin-top: 10px;
            font-weight: bold;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 40px 0;
        }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>画像Base64エンコーダー / デコーダー</h1>
    
    <div class="section">
        <h2>画像をBase64に変換</h2>
        <p>画像ファイルを選択してください</p>
        <input type="file" id="image-input" accept="image/*">
        <div id="encode-status" class="status"></div>
        
        <div id="encode-result" style="display: none; margin-top: 20px;">
            <h3>変換結果 (Base64文字列)</h3>
            <textarea class="code-editor" id="base64-output" readonly spellcheck="false" onclick="this.select()"></textarea>
            <div class="btn-group">
                <button id="copy-btn">文字列をコピー</button>
            </div>
        </div>
    </div>
    
    <hr>
    
    <div class="section">
        <h2>Base64から画像に復元</h2>
        <p>Base64文字列を貼り付けてください</p>
        <textarea class="code-editor" id="base64-input" placeholder="data:image/png;base64,..." spellcheck="false"></textarea>
        <div id="decode-status" class="status"></div>
        
        <div id="decode-result" style="display: none; margin-top: 20px;">
            <h3>プレビュー</h3>
            <div class="preview-container">
                <img id="preview-img" class="preview-img" src="" alt="プレビュー">
            </div>
            <div class="btn-group">
                <button id="download-btn">画像をダウンロード</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    // --- 1. エンコーダーの処理 ---
    const imageInput = document.getElementById('image-input');
    const encodeStatus = document.getElementById('encode-status');
    const encodeResult = document.getElementById('encode-result');
    const base64Output = document.getElementById('base64-output');
    const copyBtn = document.getElementById('copy-btn');

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // 画像ファイルかチェック
        if (!file.type.startsWith('image/')) {
            encodeStatus.className = "status";
            encodeStatus.innerText = "エラー: 画像ファイルを選択してください。";
            encodeResult.style.display = "none";
            return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
            base64Output.value = event.target.result;
            encodeResult.style.display = "block";
            encodeStatus.className = "success";
            encodeStatus.innerText = "変換に成功しました！";
        };
        reader.onerror = () => {
            encodeStatus.className = "status";
            encodeStatus.innerText = "エラー: ファイルの読み込みに失敗しました。";
        };
        reader.readAsDataURL(file); // Base64(DataURL)として読み込み
    });

    // コピーボタン処理（トースト表示）
    copyBtn.addEventListener('click', () => {
        base64Output.select();
        navigator.clipboard.writeText(base64Output.value)
            .then(() => {
                showToast("コピーしました！");
            })
            .catch(() => {
                showToast("コピーに失敗しました。手動でコピーしてください。");
            });
    });

    // --- 2. デコーダーの処理 ---
    const base64Input = document.getElementById('base64-input');
    const decodeStatus = document.getElementById('decode-status');
    const decodeResult = document.getElementById('decode-result');
    const previewImg = document.getElementById('preview-img');
    const downloadBtn = document.getElementById('download-btn');

    base64Input.addEventListener('input', () => {
        const value = base64Input.value.trim();
        if (!value) {
            decodeResult.style.display = "none";
            decodeStatus.innerText = "";
            return;
        }

        // 簡易的なBase64(DataURL)のフォーマットチェック
        if (!value.startsWith('data:image/')) {
            decodeStatus.className = "status";
            decodeStatus.innerText = "エラー: 正しい画像Base64データ（data:image/...）を入力してください。";
            decodeResult.style.display = "none";
            return;
        }

        // 画像に読み込ませてみてエラーが出ないか検証
        previewImg.src = value;
        
        previewImg.onload = () => {
            decodeStatus.className = "success";
            decodeStatus.innerText = "画像の復元に成功しました！";
            decodeResult.style.display = "block";
        };

        previewImg.onerror = () => {
            decodeStatus.className = "status";
            decodeStatus.innerText = "エラー: 画像を復元できません。データが壊れている可能性があります。";
            decodeResult.style.display = "none";
        };
    });

    // ダウンロードボタン
    downloadBtn.addEventListener('click', () => {
        const base64Data = previewImg.src;
        if (!base64Data) return;

        // 拡張子の判別 (例: data:image/png;base64,... から png を抽出)
        const mimeType = base64Data.split(';')[0].split(':')[1];
        const extension = mimeType.split('/')[1] || 'png';

        const link = document.createElement('a');
        link.href = base64Data;
        link.download = `downloaded_image.${extension}`;
        link.click();
    });

    // --- 3. トーストアニメーション制御関数 ---
    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>
</body>
</html>
