<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インデント幅調整</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .code-editor { height: 300px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .output-area { margin-top: 20px; }
    </style>
</head>
<body>
<header>
  <a href="/toolbox" class="logo">Toolbox</a>
</header>
<main>
<div id="app" class="container">
    <h1>インデント幅調整</h1>
    <div class="controls">
        <div>
            <label>各行のインデント幅</label>
            <input type="number" v-model.number="indentSize" min="0">
        </div>
        <div>
            <label>全体のオフセット</label>
            <input type="number" v-model.number="baseOffset" min="0">
        </div>
    </div>

    <h2>コードを入力してください</h2>
    <textarea class="code-editor" v-model="inputText"></textarea>

    <div class="output-area">
        <h2>変換結果</h2>
        <pre><code>{{ processedCode }}</code></pre>
        <button class="copy-btn" @click="copyToClipboard">結果をコピー</button>
    </div>

    <div class="toast" :class="{ show: isToastShow }">{{ toastMessage }}</div>
</div>
</main>

<script>
    const { createApp, ref, computed } = Vue;
    createApp({
        setup() {
            const inputText = ref("");
            const indentSize = ref(2); // 1段階ごとのスペース数
            const baseOffset = ref(0); // 大元のインデント

            // トースト用のリアクティブデータ
            const isToastShow = ref(false);
            const toastMessage = ref("コピーしました！");
            let toastTimeout = null;

            const processedCode = computed(() => {
                const lines = inputText.value.split('\n');
                return lines.map(line => {
                    const leadingSpaces = line.match(/^ */)[0].length;
                    const level = Math.floor(leadingSpaces / 2);
                    const newIndent = ' '.repeat(baseOffset.value + (level * indentSize.value));
                    return newIndent + line.trimStart();
                }).join('\n');
            });

            // クリップボードコピー & トーストアニメーション処理
            const copyToClipboard = () => {
                navigator.clipboard.writeText(processedCode.value).then(() => {
                    toastMessage.value = "コピーしました！";
                    showToast();
                }).catch(err => {
                    console.error('コピーに失敗しました: ', err);
                });
            };

            // トーストの表示制御関数
            const showToast = () => {
                isToastShow.value = true;

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    isToastShow.value = false;
                }, 2000);
            };

            return { 
                inputText, 
                indentSize, 
                baseOffset, 
                processedCode, 
                copyToClipboard,
                isToastShow,
                toastMessage
            };
        }
    }).mount('#app');
</script>
</body>
</html>
