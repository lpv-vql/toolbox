<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLエンコーダー / デコーダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .field-container {
            margin-bottom: 25px;
            position: relative;
        }
        .status {
            color: #e74c3c;
            min-height: 20px;
            margin-top: 5px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .hint {
            position: absolute;
            right: 10px;
            top: 0;
            font-size: 0.75rem;
            color: #999;
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">Toolbox</a>
</header>

<main>
    <h1>URLエンコーダー / デコーダー</h1>
    
    <div class="field-container">
        <h2>テキスト (生データ)</h2>
        <p>日本語などの通常のテキスト。入力すると下の欄にエンコードされます。</p>
        <span class="hint">クリックで全選択</span>
        <textarea class="code-editor" id="text-input" placeholder="例：こんにちは" spellcheck="false" onclick="this.select()"></textarea>
    </div>

    <div class="field-container">
        <h2>URLエンコード文字列 (%xx)</h2>
        <p>URL用の形式。ここにペーストするか入力すると、上の欄にデコードされます。</p>
        <span class="hint">クリックで全選択</span>
        <textarea class="code-editor" id="encoded-input" placeholder="例：%E3%81%93%E3%82%93%E3%81%AB%E3%81%A1%E3%81%AF" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    const textInput = document.getElementById('text-input');
    const encodedInput = document.getElementById('encoded-input');
    const errorStatus = document.getElementById('error-status');

    // テキスト側が入力されたら、エンコードしてURL側へ
    textInput.addEventListener('input', () => {
        const rawText = textInput.value;
        
        if (!rawText) {
            encodedInput.value = '';
            errorStatus.innerText = '';
            return;
        }

        encodedInput.value = encodeURIComponent(rawText);
        errorStatus.innerText = ''; // テキストからのエンコードでエラーは起きないためクリア
    });

    // URL側が入されたら、デコードしてテキスト側へ
    encodedInput.addEventListener('input', () => {
        const encodedText = encodedInput.value;

        if (!encodedText) {
            textInput.value = '';
            errorStatus.innerText = '';
            return;
        }

        try {
            textInput.value = decodeURIComponent(encodedText);
            errorStatus.innerText = ''; // 成功したらエラーを消す
        } catch (e) {
            // 不完全な%記述（%単体や、末尾が途切れているなど）の時にエラー表示
            errorStatus.innerText = '変換エラー: 正しいURLエンコード形式ではありません（文字列が途切れている可能性があります）';
        }
    });

    // 元のコードの「クリックしてコピー」の快適さを残すため、
    // テキストエリアをクリックした時に自動全選択＆自動クリップボードコピーにする親切設計
    [textInput, encodedInput].forEach(textarea => {
        textarea.addEventListener('click', () => {
            if (textarea.value) {
                navigator.clipboard.writeText(textarea.value)
                    .then(() => showToast('クリップボードにコピーしました！'))
                    .catch(() => {}); // 失敗時はトーストを出さない
            }
        });
    });

    // トーストアニメーション制御
    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 1800);
    }
</script>
</body>
</html>
