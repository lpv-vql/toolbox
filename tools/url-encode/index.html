<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLエンコーダー / デコーダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        .code-editor {
            height: 150px;
        }
        .field-container {
            margin-bottom: 35px;
        }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>URLエンコーダー / デコーダー</h1>
    
    <div class="field-container">
        <h2>テキスト (生データ)</h2>
        <p>日本語などの通常のテキストを入力してください</p>
        <textarea class="code-editor" id="text-input" spellcheck="false" onclick="this.select()"></textarea>
        <button id="copy-text-btn">コピー</button>
    </div>

    <div class="field-container">
        <h2>URLエンコード文字列</h2>
        <p>URL用の形式を入力してください</p>
        <textarea class="code-editor" id="encoded-input" spellcheck="false" onclick="this.select()"></textarea>
        <div id="error-status" class="status"></div>
        <button id="copy-encoded-btn">コピー</button>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    const textInput = document.getElementById('text-input');
    const encodedInput = document.getElementById('encoded-input');
    const errorStatus = document.getElementById('error-status');
    
    const copyTextBtn = document.getElementById('copy-text-btn');
    const copyEncodedBtn = document.getElementById('copy-encoded-btn');

    // --- リアルタイム変換処理 ---
    
    // テキスト側入力時
    textInput.addEventListener('input', () => {
        const rawText = textInput.value;
        if (!rawText) {
            encodedInput.value = '';
            errorStatus.innerText = '';
            return;
        }
        encodedInput.value = encodeURIComponent(rawText);
        errorStatus.innerText = '';
    });

    // URL側入力時
    encodedInput.addEventListener('input', () => {
        const encodedText = encodedInput.value;
        if (!encodedText) {
            textInput.value = '';
            errorStatus.innerText = '';
            return;
        }
        try {
            textInput.value = decodeURIComponent(encodedText);
            errorStatus.innerText = '';
        } catch (e) {
            errorStatus.innerText = '変換エラー: 正しいURLエンコード形式ではありません（文字列が途切れている可能性があります）';
        }
    });

    // --- コピーボタンの処理 ---

    copyTextBtn.addEventListener('click', () => {
        textInput.select();
        copyToClipboard(textInput.value);
    });

    copyEncodedBtn.addEventListener('click', () => {
        encodedInput.select();
        copyToClipboard(encodedInput.value);
    });

    // クリップボードコピー＆トースト表示共通関数
    function copyToClipboard(text) {
        if (!text) return; // 空のときはコピーしない
        navigator.clipboard.writeText(text)
            .then(() => {
                showToast("コピーしました！");
            })
            .catch(() => {
                showToast("コピーに失敗しました。手動でコピーしてください。");
            });
    }

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 1800);
    }
</script>
</body>
</html>
