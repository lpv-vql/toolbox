<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLエンコーダー / デコーダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        
        .section {
            margin-bottom: 40px;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* ボタン */
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .status {
            color: #e74c3c;
            margin-top: 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        hr {
            border: 0;
            height: 1px;
            background: #eee;
            margin: 40px 0;
        }
    </style>
</head>
<body>

<header>
    <a href="/toolbox" class="logo">Toolbox</a>
</header>

<main>
    <h1>URLエンコーダー / デコーダー</h1>
    
    <div class="section">
        <h2>URLエンコード</h2>
        <p>日本語などのテキストを、URL用の形式（%xx）に変換します。</p>
        <textarea class="code-editor" id="encode-input" placeholder="ここに通常のテキスト（例：こんにちは）を入力してください" spellcheck="false"></textarea>
        
        <div class="btn-group">
            <button id="encode-btn">エンコードする</button>
        </div>

        <div id="encode-result" style="display: none; margin-top: 20px;">
            <h3>変換結果</h3>
            <textarea class="code-editor" id="encode-output" readonly spellcheck="false" onclick="this.select()"></textarea>
            <div class="btn-group">
                <button id="copy-encode-btn" class="secondary">結果をコピー</button>
            </div>
        </div>
    </div>

    <hr>

    <div class="section">
        <h2>URLデコード</h2>
        <p>URL用の形式（%xx）の文字列を、元の日本語テキストに戻します。</p>
        <textarea class="code-editor" id="decode-input" placeholder="ここにURLエンコードされた文字列（例：%E3%81%93...）を入力してください" spellcheck="false"></textarea>
        <div id="decode-status" class="status"></div>
        
        <div class="btn-group">
            <button id="decode-btn">デコードする</button>
        </div>

        <div id="decode-result" style="display: none; margin-top: 20px;">
            <h3>復元結果</h3>
            <textarea class="code-editor" id="decode-output" readonly spellcheck="false" onclick="this.select()"></textarea>
            <div class="btn-group">
                <button id="copy-decode-btn" class="secondary">結果をコピー</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">コピーしました！</div>
</main>

<script>
    // --- 1. エンコーダーの処理 ---
    const encodeInput = document.getElementById('encode-input');
    const encodeBtn = document.getElementById('encode-btn');
    const encodeResult = document.getElementById('encode-result');
    const encodeOutput = document.getElementById('encode-output');
    const copyEncodeBtn = document.getElementById('copy-encode-btn');

    encodeBtn.addEventListener('click', () => {
        const text = encodeInput.value;
        if (!text) {
            encodeResult.style.display = "none";
            return;
        }
        // encodeURIComponentでURLエンコードを行う
        const encodedText = encodeURIComponent(text);
        encodeOutput.value = encodedText;
        encodeResult.style.display = "block";
    });

    copyEncodeBtn.addEventListener('click', () => {
        encodeOutput.select();
        copyToClipboard(encodeOutput.value);
    });

    // --- 2. デコーダーの処理 ---
    const decodeInput = document.getElementById('decode-input');
    const decodeBtn = document.getElementById('decode-btn');
    const decodeStatus = document.getElementById('decode-status');
    const decodeResult = document.getElementById('decode-result');
    const decodeOutput = document.getElementById('decode-output');
    const copyDecodeBtn = document.getElementById('copy-decode-btn');

    decodeBtn.addEventListener('click', () => {
        const text = decodeInput.value.trim();
        if (!text) {
            decodeResult.style.display = "none";
            decodeStatus.innerText = "";
            return;
        }

        try {
            // decodeURIComponentでデコード。%の記述が不正な場合はエラーを吐く
            const decodedText = decodeURIComponent(text);
            decodeOutput.value = decodedText;
            decodeStatus.innerText = "";
            decodeResult.style.display = "block";
        } catch (e) {
            decodeStatus.innerText = "エラー: 正しいURLエンコード形式ではありません。文字列が途中で切れているか、不正な文字が含まれています。";
            decodeResult.style.display = "none";
        }
    });

    copyDecodeBtn.addEventListener('click', () => {
        decodeOutput.select();
        copyToClipboard(decodeOutput.value);
    });

    // --- 3. 共通関数（クリップボードコピー＆トースト表示） ---
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text)
            .then(() => {
                showToast("コピーしました！");
            })
            .catch(() => {
                showToast("コピーに失敗しました。手動でコピーしてください。");
            });
    }

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>
</body>
</html>
