<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toolbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="/toolbox" class="logo">Toolbox</a>
  </header>

  <main>

    <section id="hero-section" class="hero">
      <h1>Toolbox</h1>
      <div class="hero-description">
        lpv_vqlの工具箱<br>
        ツールは少しずつ増やしていきたいです。だれでも自由に使ってね。
      </div>
    </section>

    <section id="favorites-section">
      <h2>お気に入り</h2>
      <div class="horizontal-tools" id="favorites"></div>
    </section>

    <section id="recent-section">
      <h2>最近</h2>
      <div class="horizontal-tools" id="recent"></div>
    </section>
    
    <section class="search-area">
      <h2>ツール一覧</h2>
      <div class="search-box">
        <input id="search" type="text" placeholder="検索...">
        <button id="clear-search">×</button>
      </div>
      <div class="categories" id="categories"></div>
    </section>

    <section>
      <div class="tools" id="tools"></div>
    </section>

  </main>

  <script>

    const tools = [
      {
        id:"sb3-json",
        name:"sb3のJSON編集",
        description:"sb3ファイルのJSONを編集します",
        tags:["scratch","code"],
        category:"Scratch",
        icon:"assets/icons/scratch.svg",
        url:"tools/sb3-json/"
      },
      {
        id:"indenter",
        name:"インデント幅調整",
        description:"コードのインデント幅の調整をします",
        tags:["code"],
        category:"プログラム",
        icon:"assets/icons/program.svg",
        url:"tools/indenter/"
      },
      {
        id:"markdown",
        name:"MDプレビュー",
        description:"Markdownのプレビューを見ることができます",
        tags:["code","text"],
        category:"テキスト",
        icon:"assets/icons/text.svg",
        url:"tools/markdown/"
      },
      {
        id:"line-break",
        name:"スペースを改行に",
        description:"半角スペースを改行に変換します",
        tags:["scratch","text"],
        category:"Scratch",
        icon:"assets/icons/scratch.svg",
        url:"tools/line-break/"
      },
      {
        id:"unicode-pre",
        name:"Unicod表示",
        description:"指定した範囲のUnicode文字を表示します",
        tags:["code","text"],
        category:"テキスト",
        icon:"assets/icons/text.svg",
        url:"tools/unicode-pre/"
      },
      {
        id:"unicode",
        name:"Unicode一括出力",
        description:"指定した範囲のUnicodeを一括出力します",
        tags:["code","text"],
        category:"テキスト",
        icon:"assets/icons/text.svg",
        url:"tools/unicode/"
      },
      {
        id:"test3",
        name:"Test",
        description:"test",
        tags:["test"],
        category:"Test",
        icon:"assets/icons/test.svg",
        url:"tools/test/"
      }
    ];

    const categories = [
      "すべて",
      ...new Set(tools.map(v=>v.category))
    ];

    const searchInput = document.getElementById("search");
    const toolsElement = document.getElementById("tools");
    const favoritesElement = document.getElementById("favorites");
    const recentElement = document.getElementById("recent");
    const categoriesElement = document.getElementById("categories");

    let currentCategory = "すべて";

    function getFavorites(){
      return JSON.parse(localStorage.getItem("favorites") || "[]");
    }

    function getRecent(){
      return JSON.parse(localStorage.getItem("recent") || "[]");
    }

    function saveFavorites(list){
      localStorage.setItem("favorites", JSON.stringify(list));
    }

    function saveRecent(list){
      localStorage.setItem("recent", JSON.stringify(list));
    }

    function score(tool, text){

      if(!text) return 0;

      text = text.toLowerCase();

      let score = 0;

      if(tool.name.toLowerCase().includes(text))
        score += 100;

      if(tool.tags.some(v => v.toLowerCase().includes(text)))
        score += 50;

      if(tool.description.toLowerCase().includes(text))
        score += 10;

      return score;
    }

    function createTool(tool){

      const favorites = getFavorites();

      const element = document.createElement("div");
      element.className = "tool";

      element.innerHTML = `
        <div class="tool-top">
          <div class="tool-top-left">
            <img class="tool-icon" src="${tool.icon}">
            <div class="tool-name">${tool.name}</div>
          </div>

          <button class="favorite ${favorites.includes(tool.id) ? "active" : ""}">
            ★
          </button>
        </div>

        <div class="tool-description">
          ${tool.description}
        </div>

        <div class="tags">
          ${tool.tags.map(v=>`<div class="tag">#${v}</div>`).join("")}
        </div>
      `;

      element.onclick = () => {

        let recent = getRecent();

        recent = recent.filter(v => v !== tool.id);

        recent.unshift(tool.id);

        recent = recent.slice(0, 10);

        saveRecent(recent);

        location.href = tool.url;
      };

      const favoriteButton = element.querySelector(".favorite");

      favoriteButton.onclick = (e) => {

        e.stopPropagation();

        let favorites = getFavorites();

        if(favorites.includes(tool.id)){
          favorites = favorites.filter(v => v !== tool.id);
        }
        else{
          favorites.push(tool.id);
        }

        saveFavorites(favorites);

        render();
      };

      element.querySelectorAll(".tag").forEach(tag => {
        tag.onclick = (e) => {
          e.stopPropagation();
          searchInput.value = tag.innerText.replace("#", "");
          render();
        };
      });

      return element;
    }

    function renderCategories(){

      categoriesElement.innerHTML = "";

      categories.forEach(category => {

        const button = document.createElement("button");

        button.className = `category ${currentCategory === category ? "active" : ""}`;

        button.innerText = category;

        button.onclick = () => {
          currentCategory = category;
          render();
        };

        categoriesElement.appendChild(button);
      });
    }

    function render(){

      renderCategories();

      const search = searchInput.value.trim().toLowerCase();

      let filtered = [...tools];

      if(currentCategory !== "すべて"){
        filtered = filtered.filter(v => v.category === currentCategory);
      }

      if(search){
        filtered = filtered
          .filter(v => score(v, search) > 0)
          .sort((a,b)=>score(b, search)-score(a, search));
      }

      toolsElement.innerHTML = "";

      if(filtered.length === 0){
        toolsElement.innerHTML = '<div class="empty">ツールが見つかりません</div>';
      }else{
        filtered.forEach(tool => {
          toolsElement.appendChild(createTool(tool));
        });
      }

      if(search){
        clearSearchButton.classList.remove("hidden");
      }else{
        clearSearchButton.classList.add("hidden");
      }

      renderFavorites();
      renderRecent();
    }

    const clearSearchButton = document.getElementById("clear-search");
    clearSearchButton.onclick = () => {

      searchInput.value = "";

      render();

      searchInput.focus();
    };
    
    function renderFavorites(){

      favoritesElement.innerHTML = "";

      const favorites = getFavorites();

      const favoriteTools = tools.filter(v => favorites.includes(v.id));

      if(favoriteTools.length === 0){
        favoritesElement.innerHTML = '<div class="empty">お気に入りしたツールがここに表示されます</div>';
        return;
      }

      favoriteTools.forEach(tool => {
        favoritesElement.appendChild(createTool(tool));
      });
    }

    function renderRecent(){

      recentElement.innerHTML = "";

      const recent = getRecent();

      const recentTools = recent
        .map(id => tools.find(v => v.id === id))
        .filter(Boolean);

      if(recentTools.length === 0){
        recentElement.innerHTML = '<div class="empty">最近開いたツールがここに表示されます</div>';
        return;
      }

      recentTools.forEach(tool => {
        recentElement.appendChild(createTool(tool));
      });
    }

    searchInput.oninput = render;

    render();

  </script>

</body>
</html>
